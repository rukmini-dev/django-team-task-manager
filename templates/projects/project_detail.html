{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">
{{ project.title }}
</h1>

<p class="mb-5">
{{ project.description }}
</p>

<h3>Tasks</h3>

<table class="table table-bordered bg-white">

<thead>

<tr>

<th>Title</th>
<th>Status</th>
<th>Assigned To</th>

</tr>

</thead>

<tbody>

{% for task in tasks %}

<tr>

<td>{{ task.title }}</td>

<td>{{ task.status }}</td>

<td>{{ task.assigned_to.username }}</td>

</tr>

{% endfor %}

</tbody>

</table>

{% endblock %}
