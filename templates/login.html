<!DOCTYPE html>
<html>

<head>

    <title>
        Login
    </title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body
    class="d-flex justify-content-center align-items-center"
    style="height:100vh; background:#f4f6f9;"
>

<div
    class="card p-5 shadow"
    style="width:400px;"
>

    <h1 class="mb-4 text-center">
        Login
    </h1>

    {% if form.errors %}

    <div class="alert alert-danger">

        Invalid username or password

    </div>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">

            <label class="form-label">

                Username

            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                required
            >

        </div>

        <div class="mb-3">

            <label class="form-label">

                Password

            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                required
            >

        </div>

        <button class="btn btn-primary w-100">

            Login

        </button>

    </form>

    <p class="mt-3 text-center">

        Don't have an account?

        <a href="/register/">

            Register

        </a>

    </p>

</div>

</body>

</html>
