<!DOCTYPE html>
<html>

<head>

    <title>

        {% block title %}
        Team Task Manager
        {% endblock %}

    </title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

        body{
            margin:0;
            background:#f4f6f9;
            font-family:Arial;
        }

        .sidebar{
            width:250px;
            height:100vh;
            background:#1e293b;
            position:fixed;
            padding-top:30px;
        }

        .sidebar a{
            display:block;
            color:white;
            text-decoration:none;
            padding:15px 25px;
            font-size:18px;
            border-radius:10px;
            margin:5px 10px;
            transition:0.3s;
        }

        .sidebar a:hover{
            background:#334155;
        }

        .content{
            margin-left:250px;
            padding:40px;
            overflow-x:auto;
        }

        .card{
            border-radius:15px;
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .profile-circle{
            width:70px;
            height:70px;
            border-radius:50%;
            background:#334155;
            margin:auto;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:28px;
            color:white;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="sidebar">

    <h3 class="text-white text-center mb-4">
        Task Manager
    </h3>

    {% if request.user.is_authenticated %}

    <div class="text-center mb-4">

        <div class="profile-circle">

            {{ request.user.username|first|upper }}

        </div>

        <p class="text-light mt-3 mb-1">

            {{ request.user.username }}

        </p>

        <small class="text-secondary">

            {{ request.user.role|title }}

        </small>

    </div>

    <a href="/">
        Dashboard
    </a>

    <a href="/projects/">
        Projects
    </a>

    <a href="/tasks-page/">
        Tasks
    </a>

    <a href="/members/">
        Members
    </a>

    <form
        action="/logout/"
        method="POST"
        class="px-3 mt-4"
    >

        {% csrf_token %}

        <button class="btn btn-danger w-100">

            Logout

        </button>

    </form>

    {% endif %}

</div>

<div class="content">

    {% block content %}

    {% endblock %}

</div>

</body>

</html>
