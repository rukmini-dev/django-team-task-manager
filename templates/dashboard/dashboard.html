{% extends 'base.html' %}
{% block title %}
Dashboard
{% endblock %}
{% block content %}

<h1 class="mb-5">
Dashboard
</h1>

<div class="row">

<div class="col-md-3">

<div class="card p-4 shadow-sm">

<h5>Total Tasks</h5>

<h1>{{ total }}</h1>

</div>

</div>

<div class="col-md-3">

<div class="card p-4 shadow-sm">

<h5>Completed</h5>

<h1>{{ completed }}</h1>

</div>

</div>

<div class="col-md-3">

<div class="card p-4 shadow-sm">

<h5>Pending</h5>

<h1>{{ pending }}</h1>

</div>

</div>

<div class="col-md-3">

<div class="card p-4 shadow-sm">

<h5>Overdue</h5>

<h1>{{ overdue }}</h1>

</div>

</div>

</div>

{% endblock %}
